include current-theme.conf

enabled_layouts grid

font_family      family='Hurmit Nerd Font' postscript_name=HurmitNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
scrollback_lines 100000

window_padding_width 5
tab_bar_style slant
enable_audio_bell no
notify_on_cmd_finish unfocused
background_opacity 0.6

# Zakázat ukládání/obnovu velikosti/roztažení okna
remember_window_size no

# 1. Zavírání oken
map ctrl+w close_window

# 2. Automatický split ve stejném adresáři (layout si to organizuje sám)
map ctrl+enter launch --cwd=current

# 3. Pohyb mezi okny (pouze Ctrl + šipky)
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
